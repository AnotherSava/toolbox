[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "A collection of small tools for day-to-day life"
requires-python = ">=3.12"
dependencies = [
    "Pillow",
    "requests",
]

[project.optional-dependencies]
browser = [
    "playwright",
]
test = [
    "pytest",
    "requests-mock",
]

[project.scripts]
fb-strikethrough = "fb_strikethrough.main:main"
flightradar = "flightradar.main:main"
image-opt = "image_opt.main:main"
notion = "notion_tools.main:main"

[tool.setuptools]
packages = ["fb_strikethrough", "flightradar", "image_opt", "notion_tools"]

[tool.setuptools.package-dir]
fb_strikethrough = "tools/fb_strikethrough/src"
flightradar = "tools/flightradar/src"
image_opt = "tools/image_opt/src"
notion_tools = "tools/notion/src"

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]

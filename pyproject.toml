[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "A collection of small tools for day-to-day life"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
browser = [
    "playwright",
]
test = [
    "pytest",
]

[project.scripts]
fb-strikethrough = "fb_strikethrough.main:main"

[tool.setuptools]
packages = ["fb_strikethrough"]

[tool.setuptools.package-dir]
fb_strikethrough = "tools/fb_strikethrough/src"

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
